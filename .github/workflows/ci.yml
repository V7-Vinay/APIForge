name: APIForge CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: apiforge
          POSTGRES_USER: apiforge
          POSTGRES_PASSWORD: apiforge_ci_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U apiforge -d apiforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: development
      APP_VERSION: 0.12.0
      BUILD_SHA: ci
      JWT_SECRET_KEY: ci-only-secret-change-me
      ENVIRONMENT_ENCRYPTION_KEY: Z3h3nU9lQkZ2R2J6WmZqN1V0Wm9kS2x5Y0h2c3B4dWk=
      COOKIE_SECURE: "false"
      CORS_ORIGINS: http://127.0.0.1:5173
      ALLOWED_HOSTS: 127.0.0.1,localhost,testserver
      DATABASE_URL: postgresql+asyncpg://apiforge:apiforge_ci_password@127.0.0.1:5432/apiforge
      REDIS_URL: redis://127.0.0.1:6379/0
      RATE_LIMIT_FAIL_OPEN: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Apply migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Run backend tests
        working-directory: backend
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck and production build
        working-directory: frontend
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: apiforge
          POSTGRES_USER: apiforge
          POSTGRES_PASSWORD: apiforge_ci_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U apiforge -d apiforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: development
      APP_VERSION: 0.12.0
      BUILD_SHA: ci
      JWT_SECRET_KEY: ci-only-secret-change-me
      ENVIRONMENT_ENCRYPTION_KEY: Z3h3nU9lQkZ2R2J6WmZqN1V0Wm9kS2x5Y0h2c3B4dWk=
      COOKIE_SECURE: "false"
      CORS_ORIGINS: http://127.0.0.1:5173
      ALLOWED_HOSTS: 127.0.0.1,localhost,testserver
      DATABASE_URL: postgresql+asyncpg://apiforge:apiforge_ci_password@127.0.0.1:5432/apiforge
      REDIS_URL: redis://127.0.0.1:6379/0
      RATE_LIMIT_FAIL_OPEN: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Apply migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start backend
        working-directory: backend
        run: nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/apiforge-backend.log 2>&1 &

      - name: Start frontend
        working-directory: frontend
        run: nohup npm run dev -- --host 127.0.0.1 > /tmp/apiforge-frontend.log 2>&1 &

      - name: Wait for services
        run: |
          python - <<'PY'
          import time, urllib.request
          for url in ("http://127.0.0.1:8000/api/v1/health", "http://127.0.0.1:5173"):
              for _ in range(60):
                  try:
                      urllib.request.urlopen(url, timeout=2)
                      break
                  except Exception:
                      time.sleep(1)
              else:
                  raise SystemExit(f"Service did not become ready: {url}")
          PY

      - name: Run browser E2E tests
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:5173
          E2E_API_BASE_URL: http://127.0.0.1:8000/api/v1
        run: npm run test:e2e

      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: apiforge-e2e-diagnostics
          path: |
            /tmp/apiforge-backend.log
            /tmp/apiforge-frontend.log
            frontend/test-results
            frontend/playwright-report
